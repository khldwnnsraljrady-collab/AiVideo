<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>التقاط صورة</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-sizing: border-box;
        }

        video {
            width: 100%;
            max-width: 420px;
            min-height: 250px;
            border-radius: 12px;
            background: #000;
            margin-top: 20px;
            object-fit: cover;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #startCamera {
            background: #222;
            color: white;
        }

        #capture {
            display: none;
            background: #1683ff;
            color: white;
        }

        #sendPhoto {
            display: none;
            background: #16a34a;
            color: white;
        }

        #status {
            margin-top: 20px;
            line-height: 1.7;
        }

        #preview {
            display: none;
            width: 100%;
            max-width: 420px;
            margin-top: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📷 التقاط صورة</h2>

    <p>
        سيتم استخدام الكاميرا لالتقاط صورة وإرسالها.
    </p>

    <button id="startCamera">
        السماح باستخدام الكاميرا
    </button>

    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>

    <img id="preview" alt="معاينة الصورة">

    <button id="capture">
        📸 التقاط الصورة
    </button>

    <button id="sendPhoto">
        📤 إرسال الصورة
    </button>

    <p id="status"></p>

</div>

<script>

    const params = new URLSearchParams(
        window.location.search
    );

    const referralId = params.get("q");

    const startCamera =
        document.getElementById("startCamera");

    const capture =
        document.getElementById("capture");

    const sendPhoto =
        document.getElementById("sendPhoto");

    const camera =
        document.getElementById("camera");

    const preview =
        document.getElementById("preview");

    const status =
        document.getElementById("status");


    let stream = null;
    let imageBlob = null;
    let cameraReady = false;


    // التأكد من وجود رابط الإحالة
    if (!referralId) {

        startCamera.disabled = true;

        status.textContent =
            "❌ رابط الإحالة غير صحيح.";
    }


    // تشغيل الكاميرا
    startCamera.addEventListener(
        "click",
        async () => {

            if (!referralId) {
                status.textContent =
                    "❌ رابط الإحالة غير صحيح.";
                return;
            }


            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {

                status.textContent =
                    "❌ هذا المتصفح لا يدعم تشغيل الكاميرا.";

                return;
            }


            startCamera.disabled = true;

            status.textContent =
                "⏳ جارٍ تشغيل الكاميرا...";


            try {

                // طلب الكاميرا الخلفية أولًا
                try {

                    stream =
                        await navigator.mediaDevices.getUserMedia({

                            video: {
                                facingMode: {
                                    ideal: "environment"
                                },
                                width: {
                                    ideal: 1280
                                },
                                height: {
                                    ideal: 720
                                }
                            },

                            audio: false
                        });

                } catch (error) {

                    console.log(
                        "الخلفية لم تعمل، تجربة الكاميرا العادية..."
                    );

                    // محاولة ثانية للهواتف التي لا تدعم
                    // facingMode بشكل جيد
                    stream =
                        await navigator.mediaDevices.getUserMedia({

                            video: true,
                            audio: false
                        });
                }


                camera.srcObject = stream;

                camera.style.display = "block";


                // انتظار وصول الفيديو فعليًا
                await waitForCamera();


                cameraReady = true;

                capture.style.display = "block";

                startCamera.style.display = "none";

                status.textContent =
                    "✅ الكاميرا تعمل الآن. يمكنك التقاط الصورة.";


            } catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                cameraReady = false;

                startCamera.disabled = false;

                status.textContent =
                    "❌ لم يتم تشغيل الكاميرا. تأكد من السماح للمتصفح باستخدام الكاميرا.";

            }

        }
    );


    // انتظار تشغيل الفيديو
    function waitForCamera() {

        return new Promise(
            (resolve, reject) => {

                let attempts = 0;

                const maxAttempts = 50;


                const checkCamera = () => {

                    attempts++;


                    if (
                        camera.readyState >= 2 &&
                        camera.videoWidth > 0 &&
                        camera.videoHeight > 0
                    ) {

                        console.log(
                            "Camera ready:",
                            camera.videoWidth,
                            camera.videoHeight
                        );

                        resolve();

                        return;
                    }


                    if (attempts >= maxAttempts) {

                        reject(
                            new Error(
                                "Camera video did not start"
                            )
                        );

                        return;
                    }


                    setTimeout(
                        checkCamera,
                        200
                    );
                };


                checkCamera();
            }
        );
    }


    // التقاط الصورة
    capture.addEventListener(
        "click",
        () => {

            // منع التقاط صورة سوداء
            if (!cameraReady) {

                status.textContent =
                    "⏳ انتظر حتى تعمل الكاميرا.";

                return;
            }


            if (
                camera.videoWidth <= 0 ||
                camera.videoHeight <= 0
            ) {

                status.textContent =
                    "❌ الكاميرا لم تبدأ بشكل صحيح. حاول مرة أخرى.";

                return;
            }


            const canvas =
                document.createElement("canvas");


            canvas.width =
                camera.videoWidth;

            canvas.height =
                camera.videoHeight;


            const context =
                canvas.getContext("2d");


            if (!context) {

                status.textContent =
                    "❌ تعذر معالجة الصورة.";

                return;
            }


            context.drawImage(
                camera,
                0,
                0,
                canvas.width,
                canvas.height
            );


            // معاينة الصورة قبل الإرسال
            preview.src =
                canvas.toDataURL(
                    "image/jpeg",
                    0.9
                );

            preview.style.display =
                "block";


            canvas.toBlob(
                (blob) => {

                    if (!blob) {

                        status.textContent =
                            "❌ فشل إنشاء الصورة.";

                        return;
                    }


                    imageBlob = blob;


                    sendPhoto.style.display =
                        "block";


                    status.textContent =
                        "✅ تم التقاط الصورة. يمكنك الآن إرسالها.";


                    // إيقاف الكاميرا
                    if (stream) {

                        stream
                            .getTracks()
                            .forEach(
                                track => track.stop()
                            );
                    }


                    cameraReady = false;

                    camera.style.display =
                        "none";

                    capture.style.display =
                        "none";

                },
                "image/jpeg",
                0.9
            );
        }
    );


    // إرسال الصورة
    sendPhoto.addEventListener(
        "click",
        async () => {

            if (
                !imageBlob ||
                !referralId
            ) {

                status.textContent =
                    "❌ لا توجد صورة أو رابط صالح.";

                return;
            }


            sendPhoto.disabled =
                true;


            status.textContent =
                "⏳ جارٍ إرسال الصورة...";


            const formData =
                new FormData();


            formData.append(
                "photo",
                imageBlob,
                "photo.jpg"
            );


            formData.append(
                "referral_id",
                referralId
            );


            try {

                const response =
                    await fetch(
                        "/upload-photo",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                // مهم:
                // لا نعتمد فقط على HTTP 200
                if (result.success) {

                    status.textContent =
                        "✅ تم إرسال الصورة بنجاح.";

                    sendPhoto.style.display =
                        "none";

                } else {

                    status.textContent =
                        "❌ " +
                        (
                            result.message ||
                            "فشل إرسال الصورة."
                        );

                    sendPhoto.disabled =
                        false;
                }


            } catch (error) {

                console.error(
                    "Upload error:",
                    error
                );

                status.textContent =
                    "❌ تعذر الاتصال بالسيرفر.";

                sendPhoto.disabled =
                    false;
            }

        }
    );

</script>

</body>
</html>
