<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال 5 صور</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
        }

        video {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            background: black;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        #capture {
            background: #1683ff;
            color: white;
        }

        #status {
            margin-top: 20px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>📷 التقاط الصور</h2>
    <p>سيتم التقاط 5 صور بفارق ثانيتين بين كل صورة.</p>

    <video id="camera" autoplay playsinline muted></video>

    <button id="capture">📸 بدء الالتقاط</button>

    <p id="status"></p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const referralId = params.get("q");

    const capture = document.getElementById("capture");
    const camera = document.getElementById("camera");
    const status = document.getElementById("status");

    let stream = null;

    async function initCamera() {
        if (!referralId) {
            status.textContent = "❌ رابط الإحالة غير صحيح.";
            return;
        }

        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
            });

            camera.srcObject = stream;

            camera.onloadedmetadata = async () => {
                try {
                    await camera.play();
                    status.textContent = "الكاميرا جاهزة للالتقاط.";
                } catch (playError) {
                    console.error(playError);
                    status.textContent = "❌ تعذر تشغيل الفيديو تلقائياً.";
                }
            };

        } catch (error) {
            status.textContent = "❌ يرجى السماح بصلاحية الكاميرا من المتصفح أو التأكد من تشغيل HTTPS.";
            console.error(error);
        }
    }

    initCamera();

    function captureSingleFrame() {
        return new Promise((resolve) => {
            const canvas = document.createElement("canvas");
            canvas.width = camera.videoWidth;
            canvas.height = camera.videoHeight;

            const context = canvas.getContext("2d");
            context.drawImage(camera, 0, 0, canvas.width, canvas.height);

            // جودة 0.7 لتقليل الحجم وتفادي رفض السيرفر للطلب
            canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.7);
        });
    }

    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    capture.addEventListener("click", async () => {
        if (!stream || !referralId) {
            status.textContent = "❌ الكاميرا غير جاهزة أو رابط الإحالة مفقود.";
            return;
        }

        capture.disabled = true;
        const totalPhotos = 5;
        const formData = new FormData();
        formData.append("referral_id", referralId);

        try {
            for (let i = 1; i <= totalPhotos; i++) {
                status.textContent = `⏳ جارٍ التقاط الصورة (${i} من ${totalPhotos})...`;
                const blob = await captureSingleFrame();

                if (blob) {
                    // يمكنك استخدام "photos[]" أو "photo" حسب المبرمج بالخلفية
                    formData.append("photos[]", blob, `photo_${i}.jpg`);
                }

                // التوقف لمدة 2 ثانية (2000 ملي ثانية) بين كل صورة
                if (i < totalPhotos) {
                    await delay(2000);
                }
            }

            if (stream) {
                stream.getTracks().forEach((track) => track.stop());
            }

            status.textContent = "⏳ جارٍ إرسال الصور إلى السيرفر...";

            const response = await fetch("/upload-photo", {
                method: "POST",
                body: formData
            });

            if (response.ok) {
                status.textContent = "✅ تم التقاط وإرسال الـ 5 صور بنجاح.";
                camera.style.display = "none";
                capture.style.display = "none";
            } else {
                status.textContent = "❌ حدث خطأ أثناء إرسال الصور (تأكد من إعدادات السيرفر لاستقبال عدة صور).";
                capture.disabled = false;
            }

        } catch (error) {
            console.error(error);
            status.textContent = "❌ تعذر الاتصال بالسيرفر.";
            capture.disabled = false;
        }
    });
</script>

</body>
</html>
