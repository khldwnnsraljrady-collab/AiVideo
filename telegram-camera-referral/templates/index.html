<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إرسال صورة</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
        }

        video {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            background: black;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        #startCamera {
            background: #222;
            color: white;
        }

        #capture {
            display: none;
            background: #1683ff;
            color: white;
        }

        #sendPhoto {
            display: none;
            background: #16a34a;
            color: white;
        }

        #status {
            margin-top: 20px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📷 التقاط صورة</h2>

    <p>
        سيتم استخدام الكاميرا لالتقاط صورة وإرسالها.
    </p>

    <button id="startCamera">
        السماح باستخدام الكاميرا
    </button>

    <video id="camera" autoplay playsinline></video>

    <button id="capture">
        📸 التقاط الصورة
    </button>

    <button id="sendPhoto">
        📤 إرسال الصورة
    </button>

    <p id="status"></p>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const referralId = params.get("q");

    const startCamera = document.getElementById("startCamera");
    const capture = document.getElementById("capture");
    const sendPhoto = document.getElementById("sendPhoto");
    const camera = document.getElementById("camera");
    const status = document.getElementById("status");

    let stream = null;
    let imageBlob = null;

    startCamera.addEventListener("click", async () => {

        if (!referralId) {
            status.textContent = "❌ رابط الإحالة غير صحيح.";
            return;
        }

        try {

            stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

            camera.srcObject = stream;

            capture.style.display = "block";
            startCamera.style.display = "none";

            status.textContent = "الكاميرا تعمل الآن.";

        } catch (error) {

            status.textContent =
                "❌ لم يتم السماح باستخدام الكاميرا.";

            console.error(error);
        }
    });


    capture.addEventListener("click", () => {

        const canvas = document.createElement("canvas");

        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;

        const context = canvas.getContext("2d");

        context.drawImage(
            camera,
            0,
            0,
            canvas.width,
            canvas.height
        );

        canvas.toBlob((blob) => {

            imageBlob = blob;

            sendPhoto.style.display = "block";

            status.textContent =
                "✅ تم التقاط الصورة. اضغط إرسال لإرسالها.";

            if (stream) {
                stream.getTracks().forEach(
                    track => track.stop()
                );
            }

            camera.style.display = "none";

        }, "image/jpeg", 0.9);
    });


    sendPhoto.addEventListener("click", async () => {

        if (!imageBlob || !referralId) {
            status.textContent =
                "❌ لا توجد صورة أو رابط صالح.";
            return;
        }

        sendPhoto.disabled = true;

        status.textContent =
            "⏳ جارٍ إرسال الصورة...";

        const formData = new FormData();

        formData.append(
            "photo",
            imageBlob,
            "photo.jpg"
        );

        formData.append(
            "referral_id",
            referralId
        );

        try {

            const response = await fetch(
                "/upload-photo",
                {
                    method: "POST",
                    body: formData
                }
            );

            const result = await response.json();

            if (response.ok) {

                status.textContent =
                    "✅ تم إرسال الصورة بنجاح.";

                sendPhoto.style.display = "none";

            } else {

                status.textContent =
                    "❌ حدث خطأ أثناء إرسال الصورة.";

                sendPhoto.disabled = false;
            }

        } catch (error) {

            console.error(error);

            status.textContent =
                "❌ تعذر الاتصال بالسيرفر.";

            sendPhoto.disabled = false;
        }
    });
</script>

</body>
</html>
